        { id: "q58", type: "textarea", label: "今回ご体験いただいたゲームや、それに伴う一連の活動に対するご感想・ご意見があればお聞かせください。", ph: "自由にご記入ください（任意）" },
      ],

    // --- Shuffle utilities ---
    function shuffleArray(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function getShuffledItems(key, items) {
      try {
        const saved = localStorage.getItem(key);
        if (saved) {
          const order = JSON.parse(saved);
          if (Array.isArray(order) && order.length === items.length) {
            return order.map(i => items[i]);
          }
        }
        const indices = shuffleArray(items.map((_, i) => i));
        localStorage.setItem(key, JSON.stringify(indices));
        return indices.map(i => items[i]);
      } catch (e) {
        return shuffleArray(items);
      }
    }

    // --- Send to Google Sheets ---
    async function sendToSheets(type, answers, ts) {
      if (!GAS_URL) return { skipped: true };
      try {
        await fetch(GAS_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ type, answers, timestamp: ts }), redirect: "follow" });
        return { success: true };
      } catch (e) { console.error("送信エラー:", e); return { success: false, error: e.message }; }
    }

    // --- Components ---
    function Bar({ cur, tot }) {
      const pct = Math.round(cur / tot * 100);
      return <div style={{ position: "sticky", top: 0, zIndex: 100, background: P.bgSolid, padding: "12px 0 8px", borderBottom: `1px solid ${P.bdr}` }}>
        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6, fontSize: 13, color: P.mut }}><span>回答の進捗</span><span>{pct}%</span></div>
        <div style={{ height: 6, background: P.bdr, borderRadius: 3, overflow: "hidden" }}><div style={{ height: "100%", width: `${pct}%`, background: `linear-gradient(90deg,${P.pri},${P.priL})`, borderRadius: 3, transition: "width 0.4s ease" }} /></div>
      </div>;
    }

    function SQ({ item, scale, value, onChange, displayNum }) {
      const n = scale.max - scale.min + 1;
      const vals = Array.from({ length: n }, (_, i) => scale.min + i);
      const lFirst = scale.labels[0]; const lLast = scale.labels[n - 1];
      return <div style={{ padding: "20px 0", borderBottom: `1px solid ${P.bdr}` }}>
        <p style={{ margin: "0 0 14px", fontSize: 15, color: P.txt, lineHeight: 1.7 }}><span style={{ color: P.acc, fontWeight: 600, marginRight: 8, fontSize: 13 }}>{displayNum}.</span>{item.t}</p>
        <div style={{ maxWidth: Math.min(n * 56, 620) }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
            {vals.map((v, i) => {
              const sel = value === v; return <div key={v} style={{ display: "flex", flexDirection: "column", alignItems: "center", flex: "1 1 0", minWidth: 0 }}>
                <button onClick={() => onChange(v)} style={{ width: 36, height: 36, borderRadius: "50%", border: sel ? `2px solid ${P.sel}` : `2px solid rgba(255,255,255,0.2)`, background: sel ? P.sel : "transparent", color: sel ? "#fff" : P.mut, fontSize: 13, fontWeight: 600, cursor: "pointer", transition: "all 0.15s", display: "flex", alignItems: "center", justifyContent: "center" }}
                  onMouseEnter={e => { if (!sel) { e.target.style.borderColor = P.priL; e.target.style.background = P.selBg } }} onMouseLeave={e => { if (!sel) { e.target.style.borderColor = "rgba(255,255,255,0.2)"; e.target.style.background = "transparent" } }}>{v}</button>
              </div>
            })}
          </div>
          {(lFirst || lLast) && <div style={{ display: "flex", justifyContent: "space-between", marginTop: 6 }}>
            <span style={{ fontSize: 10, color: P.mut, lineHeight: 1.3 }}>{lFirst}</span>
            <span style={{ fontSize: 10, color: P.mut, lineHeight: 1.3, textAlign: "right" }}>{lLast}</span>
          </div>}
        </div>
      </div>;
    }

    function SS({ section, storageKey, answers, set }) {
      const [items] = useState(() => getShuffledItems(storageKey, section.items));
      return <div style={{ marginBottom: 32 }}>
        <div style={{ background: "linear-gradient(90deg,#1E3A6E,#2B5EA7)", color: "#fff", padding: "16px 24px", borderRadius: "10px 10px 0 0", fontFamily: "'Noto Serif JP',serif" }}><h2 style={{ margin: 0, fontSize: 17, fontWeight: 600 }}>{section.title}</h2></div>
        <div style={{ background: P.card, border: `1px solid ${P.bdr}`, borderTop: "none", borderRadius: "0 0 10px 10px", padding: "8px 24px 16px" }}>
          <p style={{ fontSize: 14, color: "#fff", lineHeight: 1.8, margin: "12px 0 8px" }}>{section.inst}</p>
          {section.scaleNote && <div style={{ display: "flex", flexDirection: "column", gap: 2, fontSize: 12, color: P.mut, background: P.secBg, borderRadius: 6, padding: "8px 12px", margin: "0 0 8px" }}>
            {section.scaleNote.map((n, i) => <span key={i}>{n}</span>)}
          </div>}
          {items.map((it, idx) => <SQ key={it.id} item={it} scale={section.scale} value={answers[it.id]} onChange={v => set(it.id, v)} displayNum={idx + 1} />)}
        </div>
      </div>;
    }

    function CodeGen({ value, onChange, isPost }) {
      const BLOOD = [{ v: "1", l: "A型" }, { v: "2", l: "B型" }, { v: "3", l: "O型" }, { v: "4", l: "AB型" }, { v: "5", l: "不明" }];
      const ROWS = [{ v: "1", l: "あ行（あ〜お）" }, { v: "2", l: "か行（か〜こ）" }, { v: "3", l: "さ行（さ〜そ）" }, { v: "4", l: "た行（た〜と）" }, { v: "5", l: "な行（な〜の）" }, { v: "6", l: "は行（は〜ほ）" }, { v: "7", l: "ま行（ま〜も）" }, { v: "8", l: "や行（や・ゆ・よ）" }, { v: "9", l: "ら行（ら〜ろ）" }, { v: "0", l: "わ行（わ・を・ん）" }];
      const parse = (v) => {
        if (v && v.length >= 7) {
          const mm = parseInt(v.substring(0, 2), 10);
          const dd = parseInt(v.substring(2, 4), 10);
          const bl = v.substring(4, 5);
          const fr = v.substring(5, 6);
          const gr = v.substring(6, 7);
          if (!isNaN(mm) && !isNaN(dd) && mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31
            && BLOOD.some(o => o.v === bl) && ROWS.some(o => o.v === fr) && ROWS.some(o => o.v === gr))
            return { month: mm.toString(), day: dd.toString(), bl, fr, gr };
        }
        return { month: "", day: "", bl: "", fr: "", gr: "" };
      };
      const p = parse(value);
      const [month, setMonth] = useState(p.month);
      const [day, setDay] = useState(p.day);
      const [bl, setBl] = useState(p.bl);
      const [fr, setFr] = useState(p.fr);
      const [gr, setGr] = useState(p.gr);
      const [autoLoaded, setAutoLoaded] = useState(false);
      useEffect(() => { if (isPost && !value) { try { const saved = localStorage.getItem("survey_anon_code"); if (saved) { const p2 = parse(saved); if (p2.month) { setMonth(p2.month); setDay(p2.day); setBl(p2.bl); setFr(p2.fr); setGr(p2.gr); onChange(saved); setAutoLoaded(true) } } } catch (e) { } } }, []);

      const build = (m, d, b, f, g) => (m && d && b && f && g) ? m.padStart(2, "0") + d.padStart(2, "0") + b + f + g : "";
      const cur = () => build(month, day, bl, fr, gr);

      const onM = (m) => { setMonth(m); onChange(build(m, day, bl, fr, gr)); };
      const onD = (d) => { setDay(d); onChange(build(month, d, bl, fr, gr)); };
      const onB = (b) => { setBl(b); onChange(build(month, day, b, fr, gr)); };
      const onF = (f) => { setFr(f); onChange(build(month, day, bl, f, gr)); };
      const onG = (g) => { setGr(g); onChange(build(month, day, bl, fr, g)); };

      const code = cur();
      const filled = [month, day, bl, fr, gr].filter(Boolean).length;
      const sel = { width: "100%", padding: "10px 14px", border: `1.5px solid ${P.bdr}`, borderRadius: 8, fontSize: 15, fontFamily: "'Noto Sans JP',sans-serif", background: "rgba(255,255,255,0.08)", color: P.txt, outline: "none", cursor: "pointer" };

      const seg = (txt, active) => <span style={{ color: active ? P.priL : "rgba(255,255,255,0.25)", transition: "color 0.2s" }}>{txt}</span>;

      return <div>

          <h2 style={{ fontFamily: "'Noto Serif JP',serif", fontSize: 22, color: P.pri, marginBottom: 12 }}>{view === "post" ? "ご体験ありがとうございました" : "ご回答ありがとうございました"}</h2>
          {view === "pre" ? <p style={{ fontSize: 15, color: P.mut, lineHeight: 1.8, maxWidth: 400, margin: "0 auto 20px" }}>ゲーム体験前のご質問への回答が完了しました。データは正常に記録されました。</p> : <div style={{ textAlign: "left", margin: "0 auto 28px" }}>
            <p style={{ fontSize: 15, color: P.mut, lineHeight: 1.8, marginBottom: 20 }}>「あなたは何を選ぶ？-ゲームで体験する喪失と生の価値」の体験お疲れ様でした</p>
            <p style={{ fontSize: 14, color: P.mut, lineHeight: 1.9, marginBottom: 20 }}>この体験が、あなたの健康と幸福の支えとなり<br />より充実した人生の一助となることを願っています</p>
            <div style={{ borderTop: `1px solid ${P.bdr}`, margin: "0 0 20px" }}></div>
            <p style={{ fontSize: 14, color: P.mut, lineHeight: 1.9, marginBottom: 16 }}>今回、ゲームを体験をされた方に、もう一方のゲームも自由にお楽しみいただける機会をご用意しました。以下のURLからそれぞれのゲームを体験することができます。</p>
            <div style={{ background: "rgba(91,138,240,0.08)", border: `1px solid rgba(91,138,240,0.2)`, borderRadius: 10, padding: "18px 20px", marginBottom: 16 }}>
              <p style={{ fontSize: 14, color: "rgba(255,255,255,0.9)", fontWeight: 700, marginBottom: 8 }}>■ Straying（ノベルゲーム）</p>
              <a href="https://solventer.jp/straying" target="_blank" rel="noopener" style={{ fontSize: 13, color: P.pri, wordBreak: "break-all" }}>https://solventer.jp/straying</a>
              <p style={{ fontSize: 14, color: "rgba(255,255,255,0.9)", fontWeight: 700, marginTop: 16, marginBottom: 8 }}>■ Dice of Destiny（ダイスゲーム）</p>
              <a href="https://sunaonahito.github.io/dice-of-destiny-online3" target="_blank" rel="noopener" style={{ fontSize: 13, color: P.pri, wordBreak: "break-all" }}>https://sunaonahito.github.io/dice-of-destiny-online3</a>
            </div>
            <div style={{ background: "rgba(255,255,255,0.04)", border: `1px solid ${P.bdr}`, borderRadius: 10, padding: "18px 20px", marginBottom: 20 }}>
              <p style={{ fontSize: 13, color: P.mut, fontWeight: 600, marginBottom: 10 }}>その他：以下のバージョンも体験できます</p>
              <p style={{ fontSize: 13, color: P.mut, marginBottom: 4 }}>■ Dice of Destiny（8bit ver.）</p>
              <a href="https://sunaonahito.github.io/dice-of-destiny-online2" target="_blank" rel="noopener" style={{ fontSize: 12, color: P.pri, wordBreak: "break-all" }}>https://sunaonahito.github.io/dice-of-destiny-online2</a>
              <p style={{ fontSize: 13, color: P.mut, marginTop: 12, marginBottom: 4 }}>■ Dice of Destiny（English ver.）</p>
              <a href="https://emergence-japan.github.io/dice-of-destiny" target="_blank" rel="noopener" style={{ fontSize: 12, color: P.pri, wordBreak: "break-all" }}>https://emergence-japan.github.io/dice-of-destiny</a>
            </div>
            <p style={{ fontSize: 13, color: "rgba(255,255,255,0.5)", lineHeight: 1.7 }}>ゲームデータは収集していません。お時間の許す際にプレイいただけると幸いです。</p>
          </div>}
          <div>{view === "post" ? <a href="https://sunaonahito.github.io/Informed-consent/" style={{ display: "inline-block", padding: "12px 32px", background: "transparent", color: P.pri, border: `2px solid ${P.pri}`, borderRadius: 8, fontSize: 14, cursor: "pointer", fontWeight: 600, transition: "all 0.2s", textDecoration: "none" }}
            onMouseEnter={e => { e.target.style.background = P.pri; e.target.style.color = "#fff" }} onMouseLeave={e => { e.target.style.background = "transparent"; e.target.style.color = P.pri }}>トップに戻る</a> : <button onClick={reset} style={{ padding: "12px 32px", background: "transparent", color: P.pri, border: `2px solid ${P.pri}`, borderRadius: 8, fontSize: 14, cursor: "pointer", fontWeight: 600, transition: "all 0.2s" }}
            onMouseEnter={e => { e.target.style.background = P.pri; e.target.style.color = "#fff" }} onMouseLeave={e => { e.target.style.background = "transparent"; e.target.style.color = P.pri }}>トップに戻る</button>}</div>
        </div>
      </div>;

      // FORM
      const isPre = view === "pre"; const total = tot(); const answered = cnt(); const missing = errs ? miss() : [];
      const missingCount = missing.length;
      const showErrBanner = errs === true && missingCount > 0;
      return <div style={{ minHeight: "100vh", background: "transparent" }}>
        <div style={{ maxWidth: 720, margin: "0 auto", padding: "0 20px 60px" }}>
          <Bar cur={answered} tot={total} />
          <div style={{ padding: "28px 0 20px", borderBottom: `1px solid ${P.bdr}`, marginBottom: 28 }}>
            <button onClick={() => { if (window.confirm("回答内容は保存されません。トップに戻りますか？")) reset() }} style={{ background: "none", border: "none", color: P.mut, cursor: "pointer", fontSize: 13, padding: 0, marginBottom: 12, display: "flex", alignItems: "center", gap: 4 }}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M15 18l-6-6 6-6" /></svg>トップに戻る
            </button>
            <h1 style={{ fontFamily: "'Noto Sans JP',sans-serif", fontSize: 22, color: "rgba(255,255,255,0.85)", margin: 0, fontWeight: 500 }}>{isPre ? "ゲーム体験前のご質問" : "ゲーム体験後のご質問"}</h1>
          </div>

          {showErrBanner && <div style={{ background: "rgba(240,112,112,0.12)", border: "1px solid rgba(240,112,112,0.3)", borderRadius: 10, padding: "14px 20px", marginBottom: 24 }}>
            <p style={{ color: P.err, fontSize: 14, margin: 0, fontWeight: 500 }}>未回答の必須項目が {missingCount} 件あります。ご確認ください。</p>
          </div>}

          <div style={{ background: P.card, border: `1px solid ${P.bdr}`, borderRadius: 10, padding: "20px 24px", marginBottom: 32 }}>
            <h3 style={{ fontFamily: "'Noto Sans JP',sans-serif", fontSize: 13, color: P.acc, margin: "0 0 16px", fontWeight: 600 }}>{"Q1"}</h3>
            {(isPre ? PRE.demo : POST.code).map(q => {
              const fieldErr = errs === true && missing.includes(q.id);
              return <div key={q.id} id={`f-${q.id}`}>
                <DQ q={q} value={ans[q.id]} onChange={v => sa(q.id, v)} ov={oth[q.id]} onOv={v => so(q.id, v)} />
                {fieldErr && <p style={{ color: P.err, fontSize: 12, margin: "-16px 0 16px", fontWeight: 500 }}>{q.type === "code" ? "すべての項目を入力してコードを生成してください" : "この項目は必須です"}</p>}
              </div>;
            })}
          </div>

          {isPre ? <>
            <div id="f-q10"><SS section={PRE.swls} storageKey="survey_order_pre_swls" answers={ans} set={sa} /></div>
            <div id="f-q18"><SS section={PRE.cses} storageKey="survey_order_pre_cses" answers={ans} set={sa} /></div>
          </> : <>
            <div id="f-q2"><SS section={POST.swls} storageKey="survey_order_post_swls" answers={ans} set={sa} /></div>
            <div id="f-q10"><SS section={POST.cses} storageKey="survey_order_post_cses" answers={ans} set={sa} /></div>
            <div id="f-q41"><SS section={POST.emot} storageKey="survey_order_post_emot" answers={ans} set={sa} /></div>
            <div id="f-q49"><SS section={POST.refl} storageKey="survey_order_post_refl" answers={ans} set={sa} /></div>
            <div style={{ marginBottom: 32 }}>
              <div style={{ background: "linear-gradient(90deg,#1E3A6E,#2B5EA7)", color: "#fff", padding: "16px 24px", borderRadius: "10px 10px 0 0", fontFamily: "'Noto Serif JP',serif" }}><h2 style={{ margin: 0, fontSize: 17, fontWeight: 600 }}>§7.</h2></div>
              <div style={{ background: P.card, border: `1px solid ${P.bdr}`, borderTop: "none", borderRadius: "0 0 10px 10px", padding: "8px 24px 16px" }}>
                {POST.gameSelect.map((q, idx) => <div key={q.id} id={`f-${q.id}`}><DQ q={q} value={ans[q.id]} onChange={v => sa(q.id, v)} ov={oth[q.id]} onOv={v => so(q.id, v)} displayNum={idx + 1} /></div>)}
              </div>
            </div>
          </>}

          <div style={{ textAlign: "center", padding: "20px 0 40px" }}>
            <p style={{ fontSize: 13, color: P.mut, marginBottom: 16 }}>すべての回答を入力したら、「完了」ボタンを押してください。</p>
            <button onClick={submit} disabled={saving} style={{ padding: "14px 48px", background: P.pri, color: "#fff", border: "none", borderRadius: 10, fontSize: 16, fontWeight: 600, cursor: saving ? "wait" : "pointer", transition: "all 0.2s", opacity: saving ? 0.7 : 1, boxShadow: "0 2px 12px rgba(91,138,240,0.3)" }}
              onMouseEnter={e => { if (!saving) e.target.style.background = P.priL }} onMouseLeave={e => { if (!saving) e.target.style.background = P.pri }}>{saving ? "送信中..." : "完了"}</button>
          </div>
        </div>
      </div>;
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>

</html>
